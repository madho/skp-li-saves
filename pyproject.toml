[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skp-li-saves"
version = "0.1.0"
description = "Normalize LinkedIn saved-post exports into canonical JSONL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hermes Agent" }]
dependencies = ["openpyxl>=3.1", "playwright>=1.45"]

[project.scripts]
skp-li-saves = "skp_li_saves.cli:main"
skp-li-saves-capture = "skp_li_saves.capture_playwright:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
